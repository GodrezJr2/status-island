name: Release

# A version tag push (v1.2.3) builds both installers and publishes a release marked Latest.
# Tags with a suffix (v1.2.3-beta) publish a pre-release instead.
# Manual run builds the installers as artifacts only (nothing is published).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches every version field
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $want = $env:TAG.TrimStart('v') -replace '-.*$', ''
          $cargo = { param($path) (Select-String $path -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value }
          $versions = [ordered]@{
            'app/src-tauri/tauri.conf.json' = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'app/package.json'              = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
            'app/src-tauri/Cargo.toml'      = & $cargo app/src-tauri/Cargo.toml
            'crates/si-core/Cargo.toml'     = & $cargo crates/si-core/Cargo.toml
          }
          $bad = @($versions.GetEnumerator() | Where-Object Value -ne $want)
          foreach ($v in $bad) { "::error file=$($v.Key)::version is $($v.Value), tag is $want" }
          if ($bad.Count) { exit 1 }
          $pubkey = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $pubkey -or $pubkey -like 'REPLACE*') { "::error::the updater public key is not set in tauri.conf.json"; exit 1 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install front-end dependencies
        working-directory: app
        run: npm ci
      - name: Tests
        if: matrix.arch == 'x64'
        run: |
          cargo test --workspace
          cd app
          npm test
      - name: Build installer
        working-directory: app
        # The update key signs each installer; the app installs only updates signed with it.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis
      # A fixed file name keeps releases/latest/download/... links working for every version.
      - name: Name installer
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*.exe)
          if ($exe.Count -ne 1) { throw "expected one installer, found $($exe.Count)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe[0].FullName dist/StatusIsland-${{ matrix.arch }}-setup.exe
          Copy-Item "$($exe[0].FullName).sig" dist/StatusIsland-${{ matrix.arch }}-setup.exe.sig
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The app reads releases/latest/download/latest.json, so pre-releases never reach users.
      - name: Write update manifest
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg base "$base" \
            --rawfile x64 dist/StatusIsland-x64-setup.exe.sig \
            --rawfile arm64 dist/StatusIsland-arm64-setup.exe.sig \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
                "windows-x86_64": {signature: $x64, url: ($base + "/StatusIsland-x64-setup.exe")},
                "windows-aarch64": {signature: $arm64, url: ($base + "/StatusIsland-arm64-setup.exe")}}}' \
            > dist/latest.json
          cat dist/latest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.json
          body_path: docs/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
