name: Release

# A version tag push (v1.2.3) builds both installers and publishes a release marked Latest.
# Tags with a suffix (v1.2.3-beta) publish a pre-release instead.
# Manual run builds the installers as artifacts only (nothing is published).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install front-end dependencies
        working-directory: app
        run: npm ci
      - name: Tests
        if: matrix.arch == 'x64'
        run: |
          cargo test --workspace
          cd app
          npm test
      - name: Build installer
        working-directory: app
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: docs/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
