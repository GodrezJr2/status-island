[package]
name = "status-island"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
si-core = { path = "../../crates/si-core" }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_Security"] }
tauri = "2"
notify = "8"

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "status-island"
path = "src/main.rs"
