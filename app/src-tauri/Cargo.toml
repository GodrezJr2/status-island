[package]
name = "status-island"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[dependencies]
si-core = { path = "../../crates/si-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_Graphics_Gdi"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
notify = "8"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "status-island"
path = "src/main.rs"
